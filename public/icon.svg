<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed warm cream background, same palette as the Frühstück icon
       so the personal-app family reads as a set. No rounded corners on the
       SVG itself (the OS rounds favicon corners; transparent SVG corners
       were being filled with white on Android's launcher). -->
  <rect width="512" height="512" fill="#e8c878"/>

  <!-- Coffee bean — large, centred, fills most of the canvas to match the
       breakfast mug's visual weight. Bean is a tilted ellipse with a curved
       furrow down the middle. Dark brown silhouette + slightly darker stroke. -->
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="160" ry="220" fill="#3a2515"/>
    <ellipse cx="256" cy="256" rx="160" ry="220" fill="none" stroke="#1f100a" stroke-width="10"/>
    <!-- centre furrow: S-curve that gives the bean its identity -->
    <path d="M256 50 Q210 200 256 256 Q302 312 256 462"
      fill="none" stroke="#1f100a" stroke-width="16" stroke-linecap="round"/>
    <!-- highlight gloss on upper-left -->
    <ellipse cx="190" cy="160" rx="38" ry="68" fill="#6b4528" opacity=".55"/>
  </g>

  <!-- small star sparkle (echoes the rating system; distinguishes
       Coffee Tracker from the Frühstück mug at glance). -->
  <g transform="translate(388 110)">
    <path d="M0 -26 L7 -8 L26 -6 L12 7 L16 26 L0 17 L-16 26 L-12 7 L-26 -6 L-7 -8 Z"
      fill="#f5e0b8" stroke="#3a2515" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
